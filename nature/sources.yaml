# Real (not simulated) collective-motion datasets for the Bird Flock study.
# Raw files are downloaded into nature/data/raw/<id>/ and are never committed.
# fetch: zenodo = downloaded automatically by fetch.py (Dryad datasets via their Zenodo mirrors)
#        manual = download in a browser and place the files in nature/data/raw/<id>/
#                 (Dryad's file API needs a login token; its website download works in a browser)

datasets:
  - id: fish-tetra-2024
    title: "Selective social interactions and speed-induced leadership in schooling fish"
    species: black neon tetra (Hyphessobrycon herbertaxelrodi)
    citation: "Puy et al. 2024, PNAS, doi:10.1073/pnas.2309733121"
    url: https://zenodo.org/records/10890112
    license: CC-BY-4.0
    dims: 2
    fps: 50
    px_per_cm: 27.45          # 2745 px = 100 cm (dataset page)
    body_length_cm: 2.5
    fetch: zenodo
    zenodo_record: "10890112"
    files:
      - "Experimental_school_N=39_recording_0.csv"
      - "Experimental_school_N=39_recording_1.csv"
      - "Experimental_school_N=8_recording_0.csv"
    published_checks:
      # values the paper's model was tuned to match from the data (paper Table I and SI)
      mean_speed_cm_s: 11.0
      nn_distance_cm: 5.8

  - id: jackdaw-2019
    title: "Local interactions and their group-level consequences in flocking jackdaws"
    species: jackdaw (Corvus monedula), wild
    citation: "Ling et al. 2019, Proc. R. Soc. B, doi:10.5061/dryad.kb8js06"
    url: https://datadryad.org/stash/dataset/doi:10.5061/dryad.kb8js06
    license: CC0-1.0
    dims: 3
    fps: 60
    body_length_m: 0.34       # approximate adult jackdaw length (field-guide value, not from the paper)
    fetch: zenodo             # Zenodo mirror of the Dryad files (same names and sizes)
    zenodo_record: "5007024"
    files: [DataS1.txt, DataS2.txt]

  - id: swift-2017
    title: "Three-dimensional trajectories and network analyses of group behaviour within chimney swift flocks"
    species: chimney swift (Chaetura pelagica), wild
    citation: "Evangelista et al. 2017, Proc. R. Soc. B, doi:10.5061/dryad.p68f8"
    url: https://datadryad.org/dataset/doi:10.5061/dryad.p68f8
    license: CC0-1.0
    dims: 3
    fps: 29.97
    fetch: zenodo             # Zenodo mirror of the Dryad files (track files only; videos are 12 GB more)
    zenodo_record: "5082229"
    files: [A_nodes.hdf5, B_nodes.hdf5, C_nodes.hdf5, README_for_A_nodes.rtf]

  - id: pigeon-predation-2022
    title: "Emergence of splits and collective turns in pigeon flocks under predation"
    species: homing pigeon (Columba livia), GPS, robotic falcon
    citation: "Papadopoulou et al. 2022, doi:10.5061/dryad.905qfttkc"
    url: https://datadryad.org/stash/dataset/doi:10.5061/dryad.905qfttkc
    license: CC0-1.0
    dims: 2
    fps: 5
    body_length_m: 0.32       # approximate homing pigeon length (field-guide value, not from the paper)
    fetch: zenodo             # Zenodo mirror of the Dryad files
    zenodo_record: "6027115"
    # maneuver_outcomes.csv in the same record is SIMULATED (model output), so it is not used
    files: [all_emp_data.csv, README.txt]

  # ---- applied test: real human bottlenecks
  - id: ped-bottleneck-2009
    title: "Pedestrian trajectories in a corridor and bottleneck (HERMES, Duesseldorf 2009)"
    species: humans, 150-220 people leaving a 1.8 m corridor through an exit of 0.7 to 1.8 m
    citation: "Juelich pedestrian database, Zenodo 1054017"
    url: https://zenodo.org/records/1054017
    license: CC-BY-4.0
    dims: 2
    fps: 16
    fetch: zenodo
    zenodo_record: "1054017"
    files: [Pedestrian_Trajectories.zip, README.txt]   # unzip, then unzip Bottleneck_Data.zip into bn/

  - id: highway-merge-drat
    title: "DRaT: drone and radar trajectories at a highway merge (4 to 3 lanes), Fort Worth"
    species: vehicles, free flow and congested
    citation: "Zhu et al. 2026, ITSC; Zenodo 20171110"
    url: https://zenodo.org/records/20171110
    license: CC-BY-4.0
    dims: 2
    fps: 8
    fetch: zenodo
    zenodo_record: "20171110"
    files: [drone_GT.csv, README.md, LICENSE]
