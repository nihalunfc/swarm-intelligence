# Drone swarm that first learns from the nearest-fire rule, then improves on it with RL.
# Same forest and agent as configs/wildfire.yaml.
app: wildfire
seed: 0
env:
  grid_size: 16
  n_drones: 6
  max_payload: 6
  view_radius: 3
  max_steps: 300
  p_spread: 0.12
  p_wind: 0.30
  burn_time: [3, 6]
  n_ignitions: 2
  fire_every: 3              # drones move 3 cells per fire-spread tick (real drones are far faster than fire)
  shaping: 0.1               # per-drone training credit for closing in on the fire
agent:
  mixer: independent        # beat vdn here (66% vs 52% forest saved at 200k steps)
  hidden: [256, 256]
  lr: 0.0005
  gamma: 0.98
  tau: 0.01
  agent_id: true             # breaks symmetry between identical drones (77% vs 62% saved)
pretrain:
  rule: nearest-fire rule    # one of the app's baselines
  demo_steps: 100000         # transitions recorded from the rule (kept in replay)
  updates: 20000             # gradient steps on the demos before any RL
  margin: 0.8                # large-margin loss: the rule's action must lead by this much
  demo_weight: 1.0
  demo_decay_fraction: 0.5   # demo loss fades to zero over the first half of fine-tuning
train:
  total_steps: 400000
  n_step: 5
  num_envs: 8
  batch_size: 256
  buffer_size: 200000
  learning_starts: 2000
  gradient_steps: 1
  eps_start: 0.2
  eps_end: 0.02
  eps_fraction: 0.3
  log_every: 10000
eval:
  episodes: 50
  seed: 10000                # unseen fires: training uses seeds 0-7 streams
