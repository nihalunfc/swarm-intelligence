# Battery swarm on the full 2018-2022 dataset (build it with apps/energy/pipeline).
app: energy
seed: 0
env:
  data_path: data/clean/ercot_nrel_2018_2022.csv
  test_start: "2022-01-01"   # 2018-2021 trains, 2022 is held out
  n_agents: 10
  capacity_mwh: 400          # per battery
  max_rate_mw: 100           # per battery: 10 x 100 MW = 1 GW fleet, 4-hour batteries
  round_trip_efficiency: 0.90
  episode_hours: 168         # training episodes are random one-week windows
  eval_episode_hours: null   # evaluation plays the whole held-out period
agent:
  mixer: vdn                 # vdn or independent
  hidden: [128, 128]
  lr: 0.0005
  gamma: 0.97
  tau: 0.01
  agent_id: false            # batteries are identical, so no per-agent id
train:
  total_steps: 300000
  num_envs: 8                # parallel environment copies
  batch_size: 256
  buffer_size: 100000
  learning_starts: 2000
  gradient_steps: 1
  eps_start: 1.0
  eps_end: 0.02
  eps_fraction: 0.5
  log_every: 10000
eval:
  episodes: 1
