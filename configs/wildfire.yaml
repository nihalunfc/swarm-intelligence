# Drone swarm on a generated forest. Every episode has new ignition points and wind.
app: wildfire
seed: 0
env:
  grid_size: 16
  n_drones: 6
  max_payload: 6
  view_radius: 3
  max_steps: 300
  p_spread: 0.12
  p_wind: 0.30
  burn_time: [3, 6]
  n_ignitions: 2
  fire_every: 3              # drones move 3 cells per fire-spread tick (real drones are far faster than fire)
  shaping: 0.1               # per-drone training credit for closing in on the fire
agent:
  mixer: independent        # beat vdn here (66% vs 52% forest saved at 200k steps)
  hidden: [256, 256]
  lr: 0.0005
  gamma: 0.98
  tau: 0.01
  agent_id: true             # breaks symmetry between identical drones (77% vs 62% saved)
train:
  total_steps: 600000
  n_step: 5
  num_envs: 8
  batch_size: 256
  buffer_size: 100000
  learning_starts: 2000
  gradient_steps: 1
  eps_start: 1.0
  eps_end: 0.05
  eps_fraction: 0.4
  log_every: 10000
eval:
  episodes: 50
  seed: 10000                # unseen fires: training uses seeds 0-7 streams
