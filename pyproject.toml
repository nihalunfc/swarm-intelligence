[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-intelligence"
version = "0.1.0"
description = "Decentralized swarm engine and its energy, wildfire and hotel applications"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyyaml>=6.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hotel = ["pulp>=3.0,<4.0", "openpyxl>=3.1", "python-dateutil>=2.9"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools.package-dir]
swarm = "core/swarm"
apps = "apps"
"apps.energy" = "apps/energy"
"apps.wildfire" = "apps/wildfire"
"apps.hotel" = "apps/hotel"
"apps.hotel.energy" = "apps/hotel/energy"
"apps.hotel.housekeeping" = "apps/hotel/housekeeping"
"apps.hotel.relocation" = "apps/hotel/relocation"
"apps.hotel.shifts" = "apps/hotel/shifts"

[tool.setuptools]
packages = ["swarm", "apps", "apps.energy", "apps.wildfire", "apps.hotel", "apps.hotel.energy",
            "apps.hotel.housekeeping", "apps.hotel.relocation", "apps.hotel.shifts"]

[tool.setuptools.package-data]
"apps.energy" = ["data/sample/*.csv"]
"apps.hotel" = ["docs/data/*.json", "data/sample/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "."]
