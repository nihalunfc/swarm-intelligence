name: Experiments

# Long training runs: one job per (experiment, seed) from experiments/queue.yaml.
# Starts when that file changes on any branch, or by hand from the Actions tab.
on:
  push:
    paths: [experiments/queue.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: plan
        run: |
          pip install pyyaml
          m=$(python experiments/plan.py)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$(echo "$m" | python -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$m"

  train:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }} seed ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[${{ matrix.extras }}]"
      - name: Train and evaluate
        run: |
          swarm train --config "${{ matrix.config }}" --out out \
            --set seed=${{ matrix.seed }} label=${{ matrix.label }} ${{ matrix.set }}
      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.label }}-seed-${{ matrix.seed }}
          path: out
          retention-days: 90

  collect:
    needs: train
    if: always() && needs.train.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: downloads
      - name: Aggregate seeds
        run: |
          pip install numpy pandas pyyaml
          PYTHONPATH=core:. python experiments/collect.py downloads results
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "Experiment results from run ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
