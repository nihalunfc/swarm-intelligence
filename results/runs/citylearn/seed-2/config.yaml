app: citylearn
seed: 2
env:
  schema: null
agent:
  mixer: vdn
  hidden:
  - 128
  - 128
  lr: 0.0005
  gamma: 0.95
  tau: 0.01
  agent_id: false
train:
  total_steps: 120000
  n_step: 3
  num_envs: 4
  batch_size: 256
  buffer_size: 100000
  learning_starts: 2000
  gradient_steps: 1
  eps_start: 1.0
  eps_end: 0.02
  eps_fraction: 0.4
  log_every: 10000
  eval_every: 20000
eval:
  episodes: 1
  val_episodes: 1
label: citylearn
